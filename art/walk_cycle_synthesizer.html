<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Zero - Walk Cycle Synthesizer</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #111111;
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text: #e0e0e0;
            --border: #222222;
            --success: #00ff88;
            
            /* Avatar Palette */
            --skin-base: #F1C27D;
            --skin-shadow: #E0AC69;
            --skin-highlight: #FFDBAC;
            --skin-outline: #C68642;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            background: var(--panel);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
            transform: translateY(-2px);
        }

        button.primary {
            background: var(--accent);
            color: #000;
            border: none;
        }

        button.primary:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            background: #fff;
        }

        .main-view {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .sprite-grid-container {
            background: #000;
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
                              linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 64px 64px; /* 32px scaled 2x */
            opacity: 0.1;
            pointer-events: none;
        }

        #sprite-sheet-canvas {
            image-rendering: pixelated;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            background: #0a0a0a;
        }

        .preview-panel {
            background: #161616;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .preview-box {
            width: 128px;
            height: 128px;
            background: #000;
            margin: 0 auto 1.5rem;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--border);
        }

        #preview-canvas {
            width: 96px;
            height: 96px;
            image-rendering: pixelated;
        }

        .stats {
            font-size: 0.85rem;
            color: #888;
            margin-top: 1rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #222;
            padding-bottom: 0.2rem;
        }

        .stat-item span:last-child {
            color: var(--accent);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Avatar Zero Walk Synthesizer</h1>
            <p>Generador de Sprites 8-Direccionales v2.0</p>
        </header>

        <div class="controls">
            <button onclick="generate()">Re-Generar</button>
            <button class="primary" onclick="exportPNG()">Exportar Sprite Sheet (.png)</button>
        </div>

        <div class="main-view">
            <div class="sprite-grid-container">
                <div class="grid-overlay"></div>
                <canvas id="sprite-sheet-canvas"></canvas>
            </div>

            <div class="preview-panel">
                <h3 style="margin-top: 0; color: var(--accent);">Live Preview</h3>
                <div class="preview-box">
                    <canvas id="preview-canvas" width="32" height="32"></canvas>
                </div>
                
                <div class="controls" style="flex-direction: column;">
                    <select id="dir-select" onchange="updatePreview()" style="background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px;">
                        <option value="0">South (Abajo)</option>
                        <option value="45">South-East</option>
                        <option value="90">East (Derecha)</option>
                        <option value="135">North-East</option>
                        <option value="180">North (Arriba)</option>
                        <option value="225">North-West</option>
                        <option value="270">West (Izquierda)</option>
                        <option value="315">South-West</option>
                    </select>
                </div>

                <div class="stats">
                    <div class="stat-item"><span>Grid:</span> <span>4 x 8</span></div>
                    <div class="stat-item"><span>Cell:</span> <span>32 x 32 px</span></div>
                    <div class="stat-item"><span>Total:</span> <span>32 Frames</span></div>
                    <div class="stat-item"><span>FPS:</span> <span>8</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const spriteSize = 32;
        const framesCount = 4;
        const directions = [0, 45, 90, 135, 180, 225, 270, 315];
        
        const palette = {
            skin: '#F1C27D',
            shadow: '#E0AC69',
            highlight: '#FFDBAC',
            outline: '#C68642',
            dark: '#8d5524'
        };

        const sheetCanvas = document.getElementById('sprite-sheet-canvas');
        const previewCanvas = document.getElementById('preview-canvas');
        const sheetCtx = sheetCanvas.getContext('2d');
        const previewCtx = previewCanvas.getContext('2d');

        sheetCanvas.width = spriteSize * framesCount;
        sheetCanvas.height = spriteSize * directions.length;

        let currentFrame = 0;

        function drawAvatar(ctx, x, y, angleDeg, frame) {
            ctx.imageSmoothingEnabled = false;
            
            const rad = (angleDeg * Math.PI) / 180;
            const sin = Math.sin(rad);
            const cos = Math.cos(rad);
            
            const cx = x + 16;
            const cy = y + 31; // Anchor point

            // Animation logic (4 frames)
            let legLOffset = 0, legROffset = 0;
            let armLOffset = 0, armROffset = 0;
            let bounce = 0;
            let headTilt = 0;

            if (frame === 0) { // Contact 1
                legLOffset = 4; legROffset = -3;
                armLOffset = -3; armROffset = 3;
                headTilt = 1;
            } else if (frame === 1) { // Passing 1
                legLOffset = 0; legROffset = 0;
                armLOffset = 0; armROffset = 0;
                bounce = -1;
            } else if (frame === 2) { // Contact 2
                legLOffset = -3; legROffset = 4;
                armLOffset = 3; armROffset = -3;
                headTilt = -1;
            } else if (frame === 3) { // Passing 2
                legLOffset = 0; legROffset = 0;
                armLOffset = 0; armROffset = 0;
                bounce = -1;
            }

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 1, 7, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Z-Sorting (Simple)
            const isFacingNorth = angleDeg > 110 && angleDeg < 250;
            const isFacingWest = angleDeg > 180 && angleDeg < 360;

            function drawPart(type, offsetX, offsetY, w, h, color, hasOutline = true) {
                ctx.fillStyle = color;
                ctx.fillRect(cx + offsetX - w/2, cy - h - offsetY, w, h);
                if (hasOutline) {
                    ctx.fillStyle = palette.outline;
                    // Selective outline (bottom and away-from-light side)
                    ctx.fillRect(cx + offsetX - w/2, cy - offsetY - 1, w, 1); // Bottom
                    ctx.fillRect(cx + offsetX + w/2 - 1, cy - h - offsetY, 1, h); // Right
                }
            }

            // Draw Legs
            if (isFacingNorth) {
                drawPart('leg', legLOffset - 2, 0, 3, 10, palette.skin);
                drawPart('leg', legROffset + 2, 0, 3, 10, palette.shadow);
            } else {
                drawPart('leg', legROffset + 2, 0, 3, 10, palette.shadow);
                drawPart('leg', legLOffset - 2, 0, 3, 10, palette.skin);
            }

            // Torso
            const torsoH = 10;
            const torsoW = 9;
            const ty = 10 - bounce; // Height above ground
            const lightDot = Math.cos(rad - (135 * Math.PI / 180));

            drawPart('torso', 0, ty, torsoW, torsoH, lightDot > 0 ? palette.skin : palette.shadow);
            
            // Torso Highlight
            if (lightDot > 0) {
                ctx.fillStyle = palette.highlight;
                ctx.fillRect(cx - torsoW/2, cy - torsoH - ty, 2, torsoH);
                ctx.fillRect(cx - torsoW/2, cy - torsoH - ty, torsoW, 2);
            }

            // Arms
            if (isFacingNorth) {
                drawPart('arm', armROffset + 5, ty + 1, 2, 8, palette.shadow);
                drawPart('arm', armLOffset - 5, ty + 1, 2, 8, palette.skin);
            } else {
                drawPart('arm', armLOffset - 5, ty + 1, 2, 8, palette.skin);
                drawPart('arm', armROffset + 5, ty + 1, 2, 8, palette.shadow);
            }

            // Head
            const headW = 8, headH = 9;
            const hy = ty + torsoH;
            drawPart('head', headTilt, hy, headW, headH, lightDot > 0.5 ? palette.highlight : (lightDot > -0.5 ? palette.skin : palette.shadow));

            // Eyes (If facing south)
            if (!isFacingNorth) {
                ctx.fillStyle = palette.dark;
                const eyeX = cx + (Math.sin(rad) * 2) + headTilt;
                const eyeY = cy - hy - headH + 5;
                ctx.fillRect(eyeX - 2, eyeY, 1, 1);
                ctx.fillRect(eyeX + 1, eyeY, 1, 1);
            }
        }

        function generate() {
            sheetCtx.clearRect(0, 0, sheetCanvas.width, sheetCanvas.height);
            for (let d = 0; d < directions.length; d++) {
                for (let f = 0; f < framesCount; f++) {
                    drawAvatar(sheetCtx, f * spriteSize, d * spriteSize, directions[d], f);
                }
            }
        }

        function updatePreview() {
            const angle = parseInt(document.getElementById('dir-select').value);
            previewCtx.clearRect(0, 0, 32, 32);
            drawAvatar(previewCtx, 0, 0, angle, currentFrame);
        }

        function exportPNG() {
            const link = document.createElement('a');
            link.download = 'avatar_zero_walk_cycle.png';
            link.href = sheetCanvas.toDataURL();
            link.click();
        }

        // Animation Loop
        setInterval(() => {
            currentFrame = (currentFrame + 1) % framesCount;
            updatePreview();
        }, 150);

        window.onload = () => {
            generate();
            updatePreview();
        };
    </script>
</body>
</html>
